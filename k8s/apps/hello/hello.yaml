# Пример приложения под управлением ArgoCD: удалите папку hello/ и добавьте свои
# (например, Telegram-ботов). Любой YAML в k8s/apps/** подхватывается автоматически.
apiVersion: v1
kind: Namespace
metadata:
  name: hello
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.3 # multi-arch, есть linux/arm64
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: hello
spec:
  selector:
    app: whoami
  ports:
    - port: 80
      targetPort: 80
